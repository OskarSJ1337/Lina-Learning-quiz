apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lina-quiz
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/OskarSJ1337/Lina-Learning-quiz.git
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
