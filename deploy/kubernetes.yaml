apiVersion: apps/v1
kind: Deployment
metadata:
  name: lina-quiz
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lina-quiz
  template:
    metadata:
      labels:
        app: lina-quiz
    spec:
      containers:
        - name: web
          image: nginx:stable-alpine
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /index.html
              port: 8080
          livenessProbe:
            httpGet:
              path: /index.html
              port: 8080
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
      volumes:
        - name: site
          configMap:
            name: lina-quiz-site
        - name: config
          configMap:
            name: lina-quiz-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: lina-quiz
  namespace: media
spec:
  type: NodePort
  selector:
    app: lina-quiz
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30420
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lina-quiz
  namespace: media
  annotations:
    traefik.ingress.kubernetes.io/router.priority: "1"
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lina-quiz
                port:
                  number: 80
